<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimazing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="device-card">
        <div id="device-icon"></div>
        <div id="device-text">
          <div id="device-name">Loading…</div>
          <div id="device-sub"></div>
        </div>
      </div>

      <div id="storage-bar" title=""></div>
      <div id="storage-legend"></div>

      <nav id="nav"></nav>

      <div id="sidebar-footer">
        <span class="dot dot-ok"></span> No account, no subscription — everything here is unlocked.
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <h1 id="view-title">Overview</h1>
        <div id="topbar-actions">
          <input id="search" type="search" placeholder="Search" hidden>
          <div class="btn-group" id="export-group" hidden>
            <button id="export-csv" class="btn">Export CSV</button>
            <button id="export-json" class="btn">Export JSON</button>
          </div>
        </div>
      </header>
      <div id="content"></div>
    </main>
  </div>

  <div id="lightbox" class="hidden">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <div id="lightbox-body"></div>
  </div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
